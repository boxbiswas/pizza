
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/webp" href="/media/pizzas/pizza.webp">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>{% block title %}Pizza Order{% endblock %}</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">
                <i class="fa-solid fa-pizza-slice me-2"></i>PizzaTime
            </a>
            <div class="d-flex align-items-center ms-auto gap-2 gap-md-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'orders' %}" class="btn btn-outline-light rounded-pill btn-sm fw-medium px-3">Orders</a>
                    <a class="btn btn-warning rounded-pill btn-sm fw-bold shadow-sm px-3" href="{% url 'cart' %}">
                        <i class="fa-solid fa-cart-shopping me-1"></i> {{ request.user.get_cart_count }}
                    </a>
                    <a href="/logout/" class="btn btn-light rounded-pill btn-sm fw-medium px-3" type="submit">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light rounded-pill btn-sm fw-medium px-3">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-light rounded-pill btn-sm text-danger fw-bold px-3">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main role="main" class="py-3 py-md-4">
        <div class="container">
            {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} mb-2" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block start %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
