{% extends "base.html" %}
{% block start %}

<div class="mt-5">
    <div class="row">
        {% for pizza in pizzas %}
        <div class="col-md-3">
            <div class="card shadow-lg" style="width: 18rem;">
                <img src="/media/{{ pizza.images }}" style="height: 220px;" class="card-img-top" alt="{{ pizza.pizza_name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ pizza.pizza_name }}</h5>
                    <p>Price - {{ pizza.price }} | Category - {{ pizza.category.category_name }}</p>
                    <a href="{% url 'add_cart' pizza.uid %}" class="btn btn-success" role="button"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
                    <a href="#" class="btn btn-primary" role="button">20% discount</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
