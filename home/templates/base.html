
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>{% block title %}Pizza Order{% endblock %}</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-danger shadow-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Pizza Order</a>
            <div class="d-flex align-items-center ms-auto gap-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'orders' %}" class="btn btn-primary">Dashboard</a>
                    <a href="/logout/" class="btn btn-success" type="submit">Logout</a>
                {% else %}
                <a href="{% url 'login' %}" class="navbar-brand">Login</a>
                <a href="{% url 'register' %}" class="navbar-brand">Register</a>
                {% endif %}
                <a  class="btn btn-light p-1" href="{% url 'cart' %}"><i class="fa-solid fa-cart-shopping">{{ request.user.get_cart_count }}</i></a>
            </div>
        </div>
    </nav>

    <main role="main" class="py-4">
        <div class="container">
            {% block start %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
