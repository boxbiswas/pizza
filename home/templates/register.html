{% extends "base.html" %}
{% block start %}

<div class="row justify-content-center my-2">
    <div class="col-12 col-md-10 col-lg-6">
        <form class="card border-0 shadow-sm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-circle shadow-sm mb-2" style="width: 48px; height: 48px;">
                        <i class="fa-solid fa-user-plus fs-5"></i>
                    </div>
                    <h2 class="mb-1 fw-bold text-dark">Create Account</h2>
                    <p class="text-muted mb-0">Sign up and start ordering your favorite pizzas.</p>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="firstName" class="form-label fw-medium text-secondary">First Name</label>
                        <input type="text" class="form-control form-control-lg" name="first_name" id="firstName" placeholder="First Name" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lastName" class="form-label fw-medium text-secondary">Last Name</label>
                        <input type="text" class="form-control form-control-lg" name="last_name" id="lastName" placeholder="Last Name" required>
                    </div>
                    <div class="col-12">
                        <label for="registerUsername" class="form-label fw-medium text-secondary">Username</label>
                        <input type="text" class="form-control form-control-lg" name="username" id="registerUsername" placeholder="Choose a username" required>
                    </div>
                    <div class="col-12">
                        <label for="registerPassword" class="form-label fw-medium text-secondary">Password</label>
                        <input type="password" class="form-control form-control-lg" name="password" id="registerPassword" placeholder="Create a password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger rounded-pill w-100 mt-4 mb-3 py-2 fw-bold">Create Account</button>
                <p class="mb-0 text-center text-muted">Already have an account? <a href="/login/" class="text-danger fw-bold text-decoration-none">Login here</a></p>
            </div>
        </form>
    </div>
</div>

{% endblock %}
